[project]
name = "simple-lama-inpainting"
version = "0.1.2"
description = "Simple LaMa inpainting wrapper"
authors = [{name = "enesmsahin", email = "enessahin@outlook.com"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "opencv-python>=4.8.0",
    "pillow>=9.5.0",
    "torch>=1.13.1, !=2.0.1",
    "torchvision>=0.14.1",
    "fire>=0.5.0",
]

[project.scripts]
simple_lama = "simple_lama_inpainting.cli:lama_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simple_lama_inpainting"]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.0.280",
]
